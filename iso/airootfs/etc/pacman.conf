# pacman's settings on AximOS: Arch's repositories, from the mirrors in
# /etc/pacman.d/mirrorlist, and AximOS's own, from its packages release, whose
# packages are signed with AximOS's key, which aximos-keyring has pacman trust.

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[aximos]
SigLevel = Required
Server = https://github.com/connordavishunter-sys/AximOS-arch/releases/download/packages
